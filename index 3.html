<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA Search</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #f7f8ff;
  --card: rgba(255,255,255,.82);
  --text: #242437;
  --muted: #737589;
  --border: rgba(0,0,0,.09);
  --purple: #6946e8;
  --purple2: #8b5cf6;
}

body.dark {
  --bg: #090a10;
  --card: rgba(20,21,30,.88);
  --text: #f5f5ff;
  --muted: #9b9cad;
  --border: rgba(255,255,255,.1);
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background:
    radial-gradient(circle at 15% 10%, rgba(105,70,232,.13), transparent 30%),
    radial-gradient(circle at 90% 80%, rgba(139,92,246,.13), transparent 35%),
    var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: .3s;
}

/* TOP NAV */

.topbar {
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
}

.brand {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: .5px;
}

.nav-right {
  display: flex;
  gap: 10px;
}

.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  font-size: 18px;
  transition: .2s;
}

.icon-btn:hover {
  transform: scale(1.08);
}

/* NOVA INTERNAL BROWSER TABS */

.browser {
  width: min(1450px, 96%);
  margin: 0 auto;
}

.tabs {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px;
  border: 1px solid var(--border);
  background: var(--card);
  backdrop-filter: blur(20px);
  border-radius: 16px 16px 0 0;
  overflow-x: auto;
}

.tab {
  min-width: 150px;
  max-width: 240px;
  height: 40px;
  padding: 0 12px;
  border-radius: 11px;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  color: var(--muted);
  transition: .2s;
  white-space: nowrap;
}

.tab:hover {
  background: rgba(105,70,232,.08);
}

.tab.active {
  background: var(--bg);
  color: var(--text);
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.tab-title {
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}

.close-tab {
  border: 0;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font-size: 16px;
  opacity: .6;
}

.close-tab:hover {
  opacity: 1;
}

.new-tab {
  width: 38px;
  height: 38px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--text);
  font-size: 22px;
  cursor: pointer;
}

.new-tab:hover {
  background: rgba(105,70,232,.1);
}

/* TAB CONTENT */

.content {
  min-height: 760px;
  border: 1px solid var(--border);
  border-top: 0;
  border-radius: 0 0 20px 20px;
  background: var(--card);
  backdrop-filter: blur(25px);
  overflow: hidden;
}

.tab-page {
  display: none;
  min-height: 760px;
}

.tab-page.active {
  display: block;
  animation: appear .25s ease;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(5px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* HOME */

.home {
  padding: 65px 8% 80px;
  text-align: center;
}

.logo {
  font-size: clamp(70px, 12vw, 150px);
  font-weight: 900;
  letter-spacing: -8px;
  margin: 15px 0 0;
  background: linear-gradient(135deg,#5d3be8,#8b5cf6,#6d4aff);
  -webkit-background-clip: text;
  color: transparent;
  animation: logoFloat 4s ease-in-out infinite;
}

@keyframes logoFloat {
  0%,100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-7px);
  }
}

.subtitle {
  color: var(--muted);
  letter-spacing: 7px;
  margin-top: 8px;
  font-size: 14px;
}

/* SEARCH */

.search-box {
  max-width: 1000px;
  margin: 45px auto 15px;
  height: 72px;
  display: flex;
  align-items: center;
  padding: 8px 10px 8px 22px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 40px;
  box-shadow: 0 15px 50px rgba(70,50,150,.13);
}

.search-box input {
  flex: 1;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--text);
  font-size: 20px;
}

.search-box input::placeholder {
  color: var(--muted);
}

.search-icon {
  font-size: 25px;
  margin-right: 15px;
}

.search-button {
  width: 55px;
  height: 55px;
  border-radius: 50%;
  border: 0;
  background: linear-gradient(135deg,#6b4aed,#805df5);
  color: white;
  font-size: 25px;
  cursor: pointer;
  transition: .2s;
}

.search-button:hover {
  transform: scale(1.08);
}

/* SHORTCUTS */

.shortcuts {
  color: var(--muted);
  font-size: 14px;
  margin: 20px;
}

kbd {
  padding: 5px 9px;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: var(--card);
}

/* CHIPS */

.chips {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin: 30px 0;
}

.chip {
  border: 1px solid var(--border);
  background: var(--card);
  padding: 11px 18px;
  border-radius: 30px;
  cursor: pointer;
  color: var(--text);
  transition: .2s;
}

.chip:hover {
  transform: translateY(-3px);
  border-color: var(--purple);
}

/* AI BOX */

.ai {
  max-width: 1100px;
  margin: 45px auto;
  padding: 25px;
  text-align: left;
  border: 1px solid var(--border);
  border-radius: 22px;
  background: var(--card);
}

.ai-title {
  font-size: 20px;
  font-weight: 700;
}

.ai-text {
  color: var(--muted);
  margin-top: 12px;
  font-size: 16px;
}

/* SEARCH RESULTS */

.results {
  padding: 25px;
  min-height: 760px;
}

.results-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.back-home {
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  border-radius: 10px;
  padding: 9px 13px;
  cursor: pointer;
}

.cse-container {
  width: 100%;
}

/* MOBILE */

@media(max-width:700px) {

  .topbar {
    padding: 0 12px;
  }

  .browser {
    width: 100%;
  }

  .tabs {
    border-radius: 0;
  }

  .content {
    border-radius: 0;
  }

  .home {
    padding: 40px 15px;
  }

  .logo {
    font-size: 80px;
  }

  .search-box {
    height: 62px;
  }

  .search-box input {
    font-size: 16px;
  }

  .search-button {
    width: 48px;
    height: 48px;
  }
}
</style>
</head>

<body>

<div class="topbar">
  <div class="brand">NOVA</div>

  <div class="nav-right">
    <button class="icon-btn" onclick="toggleDark()" title="Dark mode">
      🌙
    </button>
  </div>
</div>

<div class="browser">

  <!-- INTERNAL TABS -->

  <div class="tabs" id="tabs"></div>

  <!-- TAB CONTENT -->

  <div class="content" id="pages"></div>

</div>

<script>

/* =========================
   NOVA TAB SYSTEM
========================= */

let tabs = [];
let activeTab = null;
let tabNumber = 1;

function createTab(title = "New Tab") {

  const id = "nova-tab-" + Date.now();

  const tab = {
    id: id,
    title: title,
    query: ""
  };

  tabs.push(tab);

  createTabButton(tab);
  createTabPage(tab);

  switchTab(id);
}

function createTabButton(tab) {

  const button = document.createElement("div");

  button.className = "tab";
  button.id = "button-" + tab.id;

  button.innerHTML = `
    <span>🌐</span>
    <span class="tab-title">${tab.title}</span>
    <button class="close-tab" onclick="event.stopPropagation(); closeTab('${tab.id}')">×</button>
  `;

  button.onclick = () => switchTab(tab.id);

  document.getElementById("tabs").appendChild(button);
}

function createTabPage(tab) {

  const page = document.createElement("div");

  page.className = "tab-page";
  page.id = tab.id;

  page.innerHTML = `

    <div class="home">

      <div class="logo">NOVA</div>

      <div class="subtitle">
        SEARCH BEYOND ORDINARY
      </div>

      <form class="search-box" onsubmit="searchFromTab(event,'${tab.id}')">

        <span class="search-icon">🔎</span>

        <input
          id="input-${tab.id}"
          placeholder="Search the web..."
          autocomplete="off"
        >

        <button class="search-button">
          ➜
        </button>

      </form>

      <div class="shortcuts">
        Press <kbd>/</kbd> or <kbd>Ctrl</kbd> + <kbd>K</kbd>
      </div>

      <div class="chips">

        <button class="chip" onclick="quickSearch('${tab.id}','technology')">
          💻 Tech
        </button>

        <button class="chip" onclick="quickSearch('${tab.id}','funny videos')">
          😂 Funny
        </button>

        <button class="chip" onclick="quickSearch('${tab.id}','space')">
          🚀 Space
        </button>

        <button class="chip" onclick="quickSearch('${tab.id}','gaming')">
          🎮 Gaming
        </button>

        <button class="chip" onclick="quickSearch('${tab.id}','random facts')">
          🎲 Random
        </button>

      </div>

      <div class="ai">

        <div class="ai-title">
          ✨ NOVA AI
        </div>

        <div class="ai-text">
          Ask NOVA something and I'll give you a quick preview
          before you search.
        </div>

        <div class="ai-text">
          AI preview • Verify important information
        </div>

      </div>

    </div>
  `;

  document.getElementById("pages").appendChild(page);
}

function switchTab(id) {

  activeTab = id;

  document.querySelectorAll(".tab").forEach(tab => {
    tab.classList.remove("active");
  });

  document.querySelectorAll(".tab-page").forEach(page => {
    page.classList.remove("active");
  });

  const button = document.getElementById("button-" + id);
  const page = document.getElementById(id);

  if (button) button.classList.add("active");
  if (page) page.classList.add("active");

  const input = document.getElementById("input-" + id);

  if (input) {
    setTimeout(() => input.focus(), 100);
  }
}

function closeTab(id) {

  if (tabs.length === 1) {
    return;
  }

  const index = tabs.findIndex(t => t.id === id);

  tabs = tabs.filter(t => t.id !== id);

  document.getElementById("button-" + id)?.remove();
  document.getElementById(id)?.remove();

  if (activeTab === id) {

    const next =
      tabs[index] ||
      tabs[index - 1] ||
      tabs[0];

    switchTab(next.id);
  }
}

/* =========================
   SEARCH
========================= */

function searchFromTab(event,id) {

  event.preventDefault();

  const input = document.getElementById("input-" + id);

  if (!input.value.trim()) return;

  performSearch(id,input.value.trim());
}

function quickSearch(id,query) {

  performSearch(id,query);
}

function performSearch(id,query) {

  const tab = tabs.find(t => t.id === id);

  if (!tab) return;

  tab.query = query;
  tab.title = query.length > 18
    ? query.substring(0,18) + "..."
    : query;

  const button = document.getElementById("button-" + id);

  if (button) {
    button.querySelector(".tab-title").textContent = tab.title;
  }

  const page = document.getElementById(id);

  page.innerHTML = `

    <div class="results">

      <div class="results-header">

        <button class="back-home"
          onclick="goHome('${id}')">
          ← Home
        </button>

        <strong>${escapeHTML(query)}</strong>

      </div>

      <div class="cse-container" id="cse-${id}"></div>

    </div>

  `;

  switchTab(id);

  loadSearch(id,query);
}

function goHome(id) {

  const tab = tabs.find(t => t.id === id);

  if (!tab) return;

  tab.title = "New Tab";
  tab.query = "";

  const button = document.getElementById("button-" + id);

  if (button) {
    button.querySelector(".tab-title").textContent = "New Tab";
  }

  const page = document.getElementById(id);

  page.innerHTML = "";

  createHomeInside(page,id);

  switchTab(id);
}

/* =========================
   GOOGLE CUSTOM SEARCH
========================= */

let googleLoaded = false;
let googleReady = false;
let waitingSearches = [];

function loadGoogleScript() {

  if (googleLoaded) return;

  googleLoaded = true;

  window.__gcse = {

    parsetags: "explicit",

    callback: function() {

      googleReady = true;

      waitingSearches.forEach(item => {
        renderGoogleSearch(item.id,item.query);
      });

      waitingSearches = [];
    }

  };

  const script = document.createElement("script");

  script.async = true;
  script.src =
    "https://cse.google.com/cse.js?cx=000732f98f99a49d9";

  document.head.appendChild(script);
}

function loadSearch(id,query) {

  loadGoogleScript();

  if (!googleReady) {

    waitingSearches.push({
      id:id,
      query:query
    });

    return;
  }

  renderGoogleSearch(id,query);
}

function renderGoogleSearch(id,query) {

  const container =
    document.getElementById("cse-" + id);

  if (!container) return;

  container.innerHTML = "";

  try {

    google.search.cse.element.render({

      div: container.id,

      tag: "search",

      attributes: {
        queryParameterName: "q"
      }

    });

    setTimeout(() => {

      const input =
        container.querySelector("input.gsc-input");

      if (input) {
        input.value = query;
      }

      const button =
        container.querySelector("button.gsc-search-button");

      if (button) {
        button.click();
      }

    },500);

  } catch(error) {

    container.innerHTML = `
      <p style="color:var(--muted)">
        NOVA couldn't load search results.
        Please refresh the page.
      </p>
    `;

  }
}

/* =========================
   HOME REBUILD
========================= */

function createHomeInside(page,id) {

  page.innerHTML = `

    <div class="home">

      <div class="logo">NOVA</div>

      <div class="subtitle">
        SEARCH BEYOND ORDINARY
      </div>

      <form class="search-box"
        onsubmit="searchFromTab(event,'${id}')">

        <span class="search-icon">🔎</span>

        <input
          id="input-${id}"
          placeholder="Search the web..."
          autocomplete="off"
        >

        <button class="search-button">
          ➜
        </button>

      </form>

      <div class="shortcuts">
        Press <kbd>/</kbd> or <kbd>Ctrl</kbd> + <kbd>K</kbd>
      </div>

      <div class="chips">

        <button class="chip"
          onclick="quickSearch('${id}','technology')">
          💻 Tech
        </button>

        <button class="chip"
          onclick="quickSearch('${id}','funny videos')">
          😂 Funny
        </button>

        <button class="chip"
          onclick="quickSearch('${id}','space')">
          🚀 Space
        </button>

        <button class="chip"
          onclick="quickSearch('${id}','gaming')">
          🎮 Gaming
        </button>

        <button class="chip"
          onclick="quickSearch('${id}','random facts')">
          🎲 Random
        </button>

      </div>

      <div class="ai">

        <div class="ai-title">
          ✨ NOVA AI
        </div>

        <div class="ai-text">
          Ask NOVA something and I'll give you a quick
          preview before you search.
        </div>

        <div class="ai-text">
          AI preview • Verify important information
        </div>

      </div>

    </div>
  `;
}

/* =========================
   DARK MODE
========================= */

function toggleDark() {

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "nova-dark",
    document.body.classList.contains("dark")
  );
}

if (localStorage.getItem("nova-dark") === "true") {
  document.body.classList.add("dark");
}

/* =========================
   KEYBOARD SHORTCUTS
========================= */

document.addEventListener("keydown",event => {

  if (
    event.key === "/" &&
    document.activeElement.tagName !== "INPUT"
  ) {

    event.preventDefault();

    const input =
      document.getElementById("input-" + activeTab);

    if (input) input.focus();
  }

  if (
    (event.ctrlKey || event.metaKey) &&
    event.key.toLowerCase() === "k"
  ) {

    event.preventDefault();

    const input =
      document.getElementById("input-" + activeTab);

    if (input) input.focus();
  }

  if (
    (event.ctrlKey || event.metaKey) &&
    event.key.toLowerCase() === "t"
  ) {

    event.preventDefault();

    createTab();
  }

  if (
    (event.ctrlKey || event.metaKey) &&
    event.key.toLowerCase() === "w"
  ) {

    event.preventDefault();

    closeTab(activeTab);
  }

});

/* =========================
   SECURITY
========================= */

function escapeHTML(text) {

  return text
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* =========================
   START NOVA
========================= */

createTab("New Tab");

/* NEW TAB BUTTON */

const newButton = document.createElement("button");

newButton.className = "new-tab";
newButton.innerHTML = "+";
newButton.title = "New NOVA tab";

newButton.onclick = () => {
  createTab("New Tab");
};

document.getElementById("tabs").appendChild(newButton);

</script>

</body>
</html>
